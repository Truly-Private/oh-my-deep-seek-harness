name: Host bridge candidates

on:
  pull_request:
    paths:
      - '.github/workflows/host-bridge.yml'
      - 'integrations/host-bridge/**'
      - 'integrations/hermes-dsh/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/host-bridge.yml'
      - 'integrations/host-bridge/**'
      - 'integrations/hermes-dsh/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyless-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck TypeScript adapters
        run: pnpm --filter @truly-private/dsh-host-bridge typecheck

      - name: Run TypeScript conformance tests
        run: pnpm --filter @truly-private/dsh-host-bridge test

      - name: Run Hermes Python plugin tests
        run: python3 -W error::ResourceWarning -m unittest discover -s integrations/hermes-dsh/tests -v

      - name: Load the Pi extension through the real RPC host
        env:
          DSH_BRIDGE_COMMAND: node
          DSH_BRIDGE_ARGS_JSON: '[]'
        run: |
          printf '%s\n' '{"type":"get_commands","id":"loader-pi"}' |
            pnpm --filter @truly-private/dsh-host-bridge exec pi --mode rpc --offline --no-session --no-extensions --extension "$GITHUB_WORKSPACE/integrations/host-bridge/src/pi/index.ts" |
            grep 'dsh-bridge-status'

      - name: Load the OMP extension through the real RPC host
        env:
          DSH_BRIDGE_COMMAND: node
          DSH_BRIDGE_ARGS_JSON: '[]'
        run: |
          printf '%s\n' '{"type":"get_commands","id":"loader-omp"}' |
            npm exec --yes --package=bun@1.3.14 -- sh -c 'pnpm --filter @truly-private/dsh-host-bridge exec omp --mode rpc --no-session --no-extensions --extension "$GITHUB_WORKSPACE/integrations/host-bridge/src/omp/index.ts"' |
            grep 'dsh-bridge-status'
