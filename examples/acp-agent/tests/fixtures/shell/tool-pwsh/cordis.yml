# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@truly-private/omdsh-system-prompt'

- id: tools
  name: '@truly-private/omdsh-tools'

- id: subprocess
  name: '@truly-private/omdsh-subprocess-local'

- id: bash
  name: '@truly-private/omdsh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@truly-private/omdsh-shell-env'

- id: tasks
  name: '@truly-private/omdsh-jobs-local'

- id: tool-jobs
  name: '@truly-private/omdsh-tool-jobs'

- id: tool-pwsh
  name: '@truly-private/omdsh-tool-pwsh'
