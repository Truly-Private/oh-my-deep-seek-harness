# Unattended coding-agent deployment for the bundled dsh-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@truly-private/omdsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# The DeepSeek adapter. Shipped default: full thinking at max effort on every
# request; exact-model resolution materializes request defaults before logging.
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-deepseek
  name: '@truly-private/omdsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@truly-private/omdsh-subprocess-local'

- id: bash
  name: '@truly-private/omdsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@truly-private/omdsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@truly-private/omdsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@truly-private/omdsh-session-checkpoint-policy'

- id: subagent
  name: '@truly-private/omdsh-subagent'

- id: subagent-spawn-in-process
  name: '@truly-private/omdsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@truly-private/omdsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@truly-private/omdsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@truly-private/omdsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@truly-private/omdsh-fs-observation-policy'

- id: tool-fs
  name: '@truly-private/omdsh-tool-fs'

- id: token-meter
  name: '@truly-private/omdsh-token-meter'

- id: compaction-basic
  name: '@truly-private/omdsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
