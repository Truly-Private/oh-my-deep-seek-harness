# Comparison-only composition: replace the ACP example's DeepSeek adapter with
# the same OpenAI-compatible 9Router route used by the Pi baseline.
- id: base
  name: cordis:include
  config:
    path: /opt/dsh/examples/acp-agent/cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: credentials
            name: '@deepseek-ai/dsh-credentials-local'
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                9router:
                  displayName: 9Router
                  apiKeyEnv: NINE_ROUTER_API_KEY
                  api: openai-completions
                  baseURL: !!js process.env.COMPARISON_ROUTER_BASE_URL
                  models:
                    - id: !!js process.env.COMPARISON_MODEL
                      name: 9Router Trifecta
                      contextWindow: 262144
                      maxTokens: 32768
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: !!js process.env.COMPARISON_PROVIDER
          model: !!js process.env.COMPARISON_MODEL
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: zstd
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
